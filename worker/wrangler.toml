name = "markcraft-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated list of sites allowed to call this Worker (localhost is always allowed for dev)
ALLOWED_ORIGINS = "https://markcraft.app,https://YOUR_GITHUB_USER.github.io"

# Daily per-IP rate limits. Create with: npx wrangler kv namespace create RATE
# then paste the id below and uncomment.
# [[kv_namespaces]]
# binding = "RATE"
# id = "PASTE_KV_ID"

# Secrets (never commit):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put PINATA_JWT
